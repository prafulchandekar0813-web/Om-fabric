{% extends "base.html" %}
{% block content %}
<section class="auth">
  <p class="eyebrow">WELCOME BACK</p>
  <h1>Log in</h1>
  <form method="post" action="{{ url_for('acct.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <label for="email">Email</label>
    <input id="email" type="email" name="email" value="{{ email }}" autocomplete="email" required>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required>
    <label class="check"><input type="checkbox" name="remember" value="1"> Keep me signed in for 30 days</label>
    <button class="button dark" type="submit">Log in ↗</button>
  </form>
  <p class="note"><a href="{{ url_for('acct.forgot') }}">Forgot your password?</a></p>
  <p class="note">New here? <a href="{{ url_for('acct.register', next=next) }}">Create an account</a> — or just check out as a guest, no account needed.</p>
</section>
{% endblock %}
