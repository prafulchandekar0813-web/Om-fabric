{% extends "base.html" %}
{% block content %}
<section class="product-detail">
  <div class="gallery">
    {% for image in product.images %}<img src="{{ image | img_url }}" alt="{{ product.title }}" loading="lazy">{% endfor %}
  </div>
  <div>
    <p class="eyebrow">{{ product.vendor }}</p>
    <h1>{{ product.title }}</h1>
    <p class="price">{{ selected.price | money }}</p>
    <form action="{{ url_for('cart_add') }}" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      {% if not product.has_only_default_variant %}
        <label for="variant">Choose option</label>
        <select id="variant" name="id">
          {% for v in product.variants %}
            <option value="{{ v.id }}" data-price="{{ v.price | money }}"{% if v.id == selected.id %} selected{% endif %}{% if not v.available %} disabled{% endif %}>{{ v.title }} — {{ v.price | money }}{% if not v.available %} (Sold out){% endif %}</option>
          {% endfor %}
        </select>
      {% else %}
        <input type="hidden" name="id" value="{{ selected.id }}">
      {% endif %}
      <label for="qty">Quantity</label>
      <input id="qty" type="number" name="quantity" min="1" max="20" value="1">
      <button class="button dark" type="submit" {% if not product.available %}disabled{% endif %}>{{ 'Add to bag' if product.available else 'Sold out' }}</button>
    </form>
    <div class="description">{{ product.description | safe }}</div>
  </div>
</section>
{% endblock %}
